name: gates

# §11 asked for the colour gate to run in CI on the token file: "A hex that
# enters --profit, --loss, --warning, --accent or a series slot without a
# passing run is a defect regardless of how it looks." Until now it ran only
# when someone remembered, which is the class of gate this repo keeps writing
# down and not executing.
#
# CEILING, stated rather than discovered: this repo has no branch protection
# (no paid plan), so a red run here is DETECTED and RECORDED — it does not stop
# a merge. Read the run before merging; the check does not read it for you.
#
# The two browser gates are deliberately NOT here. scripts/reflow.mjs and
# scripts/sweep.mjs need a dev server plus a CDP Chrome, and a flaky required
# check teaches people to ignore checks. They run locally and their artifacts
# are committed under docs/reflow and docs/sweep.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege, declared rather than inherited. Without this the job token
# takes whatever the repository or organisation default happens to be, which is
# not a property this file controls or can see.
permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      # Pinned to reviewed commit SHAs, not the mutable v4 tags. A major-version
      # tag can be retargeted at any time, so `@v4` is a promise about a name,
      # not about code. Comments record which tag each SHA was at pinning time.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Reads the hexes back out of src/tokens.css, so the gate cannot drift
      # from the file it is meant to be checking.
      - name: colour system (§2c)
        run: npm run check:palette

      - name: typecheck
        run: npx tsc -b

      - name: build
        run: npm run build
